# fly.toml app configuration file generated for dataforge-api on 2026-03-29T17:05:49-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dataforge-api'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATAFORGE_DB_PATH = '/data/dataforge_platform.db'
  ENV = 'production'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
